name: Hourly sync

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
    # GitHub often delays or drops runs scheduled exactly on the hour; these back-ups make sure
    # roles are re-checked at least hourly. Runs never overlap (see concurrency below).
    - cron: '23 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = discover new companies at 01:00 UTC, verify otherwise'
        type: choice
        options: [auto, verify, discover]
        default: auto
      force_yc:
        description: 'Re-check every YC company page now'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-leads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pick mode
        id: mode
        run: |
          mode="${{ inputs.mode || 'auto' }}"
          if [ "$mode" = "auto" ]; then
            if [ "$(date -u +%H)" = "01" ]; then mode=discover; else mode=verify; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Deeper search (companies hiring interns + their job boards)
        run: node scripts/discover.mjs
        env:
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}

      - name: Fetch, discover and verify remote tech roles
        run: node scripts/update.mjs --mode=${{ steps.mode.outputs.mode }} ${{ inputs.force_yc && '--force-yc' || '' }}

      - name: Points of contact (website scan, Prospeo, email validation)
        run: node scripts/contacts.mjs
        env:
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}

      - name: Integrity tests (5 countries, remote tech internships only, no USA, validated emails)
        run: python3 tests/test_site_integrity.py

      # RTI tracker data (data/leads.json): the site's previous pipeline, unchanged, so the tracker keeps
      # showing remote tech jobs and internships in the six regions.
      - name: RTI tracker data (remote tech jobs + internships, six regions)
        run: node scripts/rti/update.mjs --mode=${{ steps.mode.outputs.mode }} ${{ inputs.force_yc && '--force-yc' || '' }}

      - name: RTI tracker contacts
        run: node scripts/rti/contacts.mjs
        env:
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}

      - name: RTI tracker data tests
        run: python3 tests/test_rti_data.py

      - name: Commit data
        run: |
          git config user.name "leads-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1

  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    permissions:
      pages: write
      id-token: write
